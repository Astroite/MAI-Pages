name: Sync MAI Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync latest release metadata & download binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAI_REPO: Astroite/MAI
          SITE_URL: https://mai.astroite.com
        run: node scripts/sync-release.mjs

      - name: Commit generated release data & binaries
        run: |
          git config user.name "mai-release-bot"
          git config user.email "actions@github.com"
          git add src/data/releases.generated.json public/downloads/ || true
          git diff --cached --quiet || git commit -m "chore: sync MAI latest release"
          git push
